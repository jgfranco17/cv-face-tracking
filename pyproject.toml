[project]
name = "face-detection-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-contrib-python>=4.10,<5",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.4.1",
    "isort>=9.0.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
addopts = [
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
